async function deriveKey(pin){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array(SALT),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

async function unlock(){
  const c=document.getElementById('content');
  if(c.dataset.ok==='1'){document.getElementById('gate').style.display='none';c.style.display='block';return;}
  const pin=document.getElementById('pin').value.trim();
  if(!pin){document.getElementById('err').textContent='请输入访问码';return;}
  try{
    const key=await deriveKey(pin);
    const ct=Uint8Array.from(atob(CT),x=>x.charCodeAt(0));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(IV)},key,ct);
    document.getElementById('gate').style.display='none';
    c.style.display='block';
    c.innerHTML=new TextDecoder().decode(pt);
    c.dataset.ok='1';
    c.querySelectorAll('script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);});
    sessionStorage.setItem('acp_pin',pin);
  }catch(e){document.getElementById('err').textContent='访问码错误';}
}
