async function deriveKey(pin){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array(SALT),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

async function unlock(){
  const pin=document.getElementById('pin').value.trim();
  if(!pin){document.getElementById('err').textContent='请输入访问码';return;}

    const key=await deriveKey(pin);
    const ct=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));

}
